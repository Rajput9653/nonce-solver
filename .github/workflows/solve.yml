name: solve
on:
  push:
    branches: [main]
    paths: ["puzzle.cnf"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: solve, cancel-in-progress: true }
jobs:
  kissat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        job: [0,1,2,3,4]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q passagemath-kissat
      - name: portfolio
        id: s
        run: |
          K=$(python3 -c "import glob,sys,site;c=glob.glob(site.getusersitepackages()+'/sage_wheels/bin/kissat')+glob.glob(sys.prefix+'/lib/python3*/site-packages/sage_wheels/bin/kissat')+glob.glob('/opt/hostedtoolcache/**/sage_wheels/bin/kissat',recursive=True);print(c[0])")
          N=$(nproc); echo "cores $N"; J=${{ matrix.job }}
          OPTS=("" "--sat" "--target=2" "--phase=false" "--sat --phase=false" "--stable=2" "--sat --target=2" "--walkinitially=true")
          for c in $(seq 0 $((N-1))); do
            S=$((J*N+c+$(date +%s)%1000)); O=${OPTS[$(((J*N+c)%8))]}
            (timeout 780 $K -q $O --seed=$S puzzle.cnf > out$c.txt; echo $? > rc$c.txt) &
          done
          END=$(( $(date +%s) + 790 ))
          while [ $(date +%s) -lt $END ]; do
            for c in $(seq 0 $((N-1))); do
              if [ -f rc$c.txt ] && [ "$(cat rc$c.txt)" = "10" ]; then cp out$c.txt solution.txt; pkill kissat || true; echo "found=1" >> $GITHUB_OUTPUT; exit 0; fi
            done
            sleep 1
          done
          pkill kissat || true
          echo "found=0" >> $GITHUB_OUTPUT
      - if: steps.s.outputs.found == '1'
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          H=$(sha256sum puzzle.cnf | cut -c1-16)
          git checkout --orphan sol-$H; git rm -rq --cached . ; git add solution.txt; git commit -qm sol
          git push -f origin sol-$H
          exit 1
